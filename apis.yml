name: MomMom
description: >-
  MomMom (맘맘) is a South Korean consumer parenting and family-activity platform that helps
  parents discover places to go with their kids and products to buy for them. The mom-mom.net
  website and app curate kid-friendly destinations by region, family accommodation and resort
  deals, restaurant and class discounts, and community-driven product rankings (국민템랭킹) covering
  baby and childcare essentials, alongside parenting tips. It is a B2C curation, deals, and
  recommendation service, backed as a 500 Global portfolio company; no public developer API,
  documentation, or well-known discovery surface is currently published (probed 2026-07-20).
